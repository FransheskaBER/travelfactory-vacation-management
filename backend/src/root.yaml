openapi: 3.0.3
info:
  title: Vacation Management API
  version: 1.0.0
paths:
  /login:
    post:
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      summary: Authenticate with email + password; the JWT is issued as an httpOnly cookie, never in the body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: >
            JWT issued via Set-Cookie (token=<jwt>; HttpOnly; SameSite=Lax;
            Path=/; Max-Age=86400; Secure when COOKIE_SECURE=true). The body
            carries the session facts the client can no longer decode from the
            token itself; expiresAt is epoch ms, feeding the frontend's
            proactive expiry check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    enum: [Requester, Validator]
                  userId:
                    type: string
                    format: uuid
                  expiresAt:
                    type: integer
                    format: int64
        '400':
          description: Malformed input
        '401':
          description: Invalid credentials

  /logout:
    post:
      x-handler: handlers/auth#logout
      summary: >
        Clears the auth cookie. This endpoint exists only because JS cannot
        delete an httpOnly cookie — it inverts spec 4.8 §8 Q5's "no /logout
        URL" decision, which assumed a client-readable token. Deliberately
        unauthenticated and idempotent: always 200, even with no or an
        expired session — a logout that can fail is hostile UX.
      responses:
        '200':
          description: Set-Cookie with Max-Age=0 deletes the token cookie; empty object body

  /requests:
    post:
      summary: Submit a new vacation request (Requester role required)
      x-handler: handlers/requests#createRequest
      x-inputParser: handlers/requests#parseCreateRequestInput
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Created — status set to Pending, VacationRequestCreatedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '400':
          description: Rule 1 (end before start) or Rule 4 (past date) violated, or malformed body/date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Requester role
        '409':
          description: Rule 2 — overlaps an existing Pending/Approved request for this user

    get:
      summary: Validator dashboard — all requests, paginated and filterable (Validator role required)
      x-handler: handlers/requests#getDashboard
      x-inputParser: handlers/requests#parseDashboardInput
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          description: Values above 100 are clamped to 100 (spec 4.6 §8 Q4)
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated result set, sorted most-recently-submitted-first (A15); a page past the last result returns an empty data array (US-5)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VacationRequest'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '400':
          description: Malformed query parameter (non-integer or < 1 page/limit, unknown status, non-uuid userId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role

  /requests/mine:
    get:
      summary: List the authenticated user's own requests, unpaginated (Requester role required)
      x-handler: handlers/requests#listMyRequests
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All of the caller's own requests, every status, scoped via JWT user_id (never a query param)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VacationRequest'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Requester role

  /requests/team:
    get:
      summary: Shared approved-only view across all employees (any authenticated role — A1, A14; month-grouping is the frontend's)
      x-handler: handlers/requests#listTeamVacations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Approved requests only; requester name + date range only, reason excluded (A14); sorted startDate ASC, id ASC (spec 4.6 §8 Q6)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    requesterName:
                      type: string
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
        '401':
          description: Missing or invalid token

  /requests/:id/approve:
    post:
      summary: Approve a pending request (Validator role required)
      x-handler: handlers/requests#approveRequest
      x-inputParser: handlers/requests#parseRequestIdInput
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved — reviewed_by set to caller's user_id, VacationRequestApprovedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '400':
          description: Malformed id (not a uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role
        '404':
          description: No request with this id
        '409':
          description: Request is not in Pending status (assertPending, Rule 3 / ADR 0004)

  /requests/:id/reject:
    post:
      summary: Reject a pending request with a required comment (Validator role required)
      x-handler: handlers/requests#rejectRequest
      x-inputParser: handlers/requests#parseRejectInput
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Rejected — comment stored, reviewed_by set, VacationRequestRejectedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '400':
          description: Rule 5 — comment missing or empty after trim, malformed body, or malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role
        '404':
          description: No request with this id
        '409':
          description: Request is not in Pending status (assertPending, Rule 3 / ADR 0004)

  /users:
    get:
      summary: List all users for the validator dashboard filter (Validator role required — A10)
      x-handler: handlers/users#listUsers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All users, id and display name only — no email, role, or credentials (A10); sorted name ASC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: >
        JWT carried in an httpOnly cookie (cookie-only — the former
        Authorization: Bearer surface is retired). Documents "a valid token
        is required" only. Role-specific enforcement (Requester vs Validator
        vs any) is NOT expressible in OpenAPI's security field — it's
        enforced by the requireRole() wrapper (ADR 0003), and stated
        explicitly per-endpoint above instead.

  schemas:
    VacationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          enum: [Pending, Approved, Rejected]
        comments:
          type: string
          maxLength: 500
          nullable: true
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
