openapi: 3.0.3
info:
  title: Vacation Management API
  version: 1.0.0
 
paths:
  /login:
    post:
      summary: Authenticate and issue a JWT (public)
      x-handler: handlers/auth#login
      x-inputParser: handlers/auth#parseLoginInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated — JWT returned, encoding user_id and role
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid email or password
 
  /requests:
    post:
      summary: Submit a new vacation request (Requester role required)
      x-handler: handlers/requests#createRequest
      x-inputParser: handlers/requests#parseCreateRequestInput
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                reason:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Created — status set to Pending, VacationRequestCreatedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '400':
          description: Rule 1 (end before start) or Rule 4 (past date) violated, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Requester role
        '409':
          description: Rule 2 — overlaps an existing Pending/Approved request for this user
 
    get:
      summary: Validator dashboard — all requests, paginated and filterable (Validator role required)
      x-handler: handlers/requests#getDashboard
      x-inputParser: handlers/requests#parseDashboardInput
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated result set, sorted most-recently-submitted-first (A15)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VacationRequest'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role
 
  /requests/mine:
    get:
      summary: List the authenticated user's own requests, unpaginated (Requester role required)
      x-handler: handlers/requests#listMyRequests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All of the caller's own requests, every status, scoped via JWT user_id (never a query param)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VacationRequest'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Requester role
 
  /requests/team:
    get:
      summary: Shared approved-only view across all employees, grouped by month (any authenticated role — A1, A14)
      x-handler: handlers/requests#listTeamVacations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Approved requests only; requester name + date range only, reason excluded (A14)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    requesterName:
                      type: string
                    startDate:
                      type: string
                      format: date
                    endDate:
                      type: string
                      format: date
        '401':
          description: Missing or invalid token
 
  /requests/:id/approve:
    post:
      summary: Approve a pending request (Validator role required)
      x-handler: handlers/requests#approveRequest
      x-inputParser: handlers/requests#parseRequestIdInput
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved — reviewed_by set to caller's user_id, VacationRequestApprovedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role
        '404':
          description: No request with this id
        '409':
          description: Request is not in Pending status (assertPending, Rule 3 / ADR 0004)
 
  /requests/:id/reject:
    post:
      summary: Reject a pending request with a required comment (Validator role required)
      x-handler: handlers/requests#rejectRequest
      x-inputParser: handlers/requests#parseRejectInput
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Rejected — comment stored, reviewed_by set, VacationRequestRejectedEvent emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacationRequest'
        '400':
          description: Rule 5 — comment missing or empty
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role
        '404':
          description: No request with this id
        '409':
          description: Request is not in Pending status (assertPending, Rule 3 / ADR 0004)
  /users:
    get:
      summary: List all users for the validator dashboard filter (Validator role required — A10)
      x-handler: handlers/users#listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All users, id and display name only — no email, role, or credentials (A10)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          description: Missing or invalid token
        '403':
          description: Caller does not hold the Validator role

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Documents "a valid token is required" only. Role-specific enforcement
        (Requester vs Validator vs any) is NOT expressible in OpenAPI's security
        field — it's enforced by the requireRole() wrapper (ADR 0003), and stated
        explicitly per-endpoint above instead.
 
  schemas:
    VacationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [Pending, Approved, Rejected]
        comments:
          type: string
          nullable: true
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
 
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
 